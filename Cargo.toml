[package]
name = "php-builds"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "php-builds"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
lzma-rs = "0.3"
