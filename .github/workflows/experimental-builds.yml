name: Experimental PHP builds

on:
  workflow_dispatch:
    inputs:
      php_minor:
        type: choice
        options: [all, "8.1", "8.2", "8.3", "8.4", "8.5", "8.6"]
        default: all
      target:
        type: choice
        options: [all, ubuntu-22.04, macos-15]
        default: all
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php_minor }} / ${{ matrix.os }}
    if: ${{ (inputs.php_minor == 'all' || inputs.php_minor == matrix.php_minor) && (inputs.target == 'all' || inputs.target == matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        php_minor: ["8.1", "8.2", "8.3", "8.4", "8.5", "8.6"]
        os: [ubuntu-22.04, macos-15]
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential autoconf pkg-config \
              libssl-dev libxml2-dev libcurl4-openssl-dev libsqlite3-dev \
              zlib1g-dev libonig-dev libreadline-dev libzip-dev libbz2-dev \
              libpng-dev libjpeg-dev libwebp-dev libicu-dev
          else
            brew install autoconf pkg-config openssl@3 libxml2 curl \
              sqlite3 zlib oniguruma readline libzip bzip2 libpng jpeg-turbo \
              webp icu4c
          fi
      - uses: jdx/mr-boxington-action@v1
      - name: Build Rust CLI
        run: mbx build --release --locked
      - name: Build PHP package
        env:
          PHP_MINOR: ${{ matrix.php_minor }}
        run: target/release/php-builds build --minor "$PHP_MINOR" --root "${{ runner.temp }}/php-build"
      - name: Verify relocated package
        env:
          PHP_MINOR: ${{ matrix.php_minor }}
        run: target/release/php-builds verify --package "${{ runner.temp }}/php-build/package" --minor "$PHP_MINOR"
      - name: Upload package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.php_minor }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/php-build/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-php-${{ matrix.php_minor }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/php-build/logs/*
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: build
    if: ${{ inputs.release == true && inputs.php_minor != 'all' && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Assemble release assets
        id: assets
        run: |
          mkdir release-assets
          version=""
          for package in artifacts/php-*; do
            [ -d "$package" ] || continue
            manifest="$package/manifest.json"
            [ -f "$manifest" ] || continue
            package_version="$(jq -er '.source_version' "$manifest")"
            if [ -z "$version" ]; then
              version="$package_version"
            elif [ "$version" != "$package_version" ]; then
              echo "::error::Package manifests report different PHP versions: $version and $package_version"
              exit 1
            fi
            artifact="${package##*/}"
            for asset in "$package"/*; do
              [ -f "$asset" ] || continue
              name="$(basename "$asset")"
              if [ "$name" = manifest.json ] || [ "$name" = SHA256SUMS ]; then
                cp "$asset" "release-assets/${artifact}-${name}"
              else
                cp "$asset" "release-assets/$name"
              fi
            done
          done
          [ -n "$version" ] || { echo "::error::No package manifests found"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="php-${{ steps.assets.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --title "PHP ${{ steps.assets.outputs.version }}" --prerelease
          fi
