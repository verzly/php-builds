name: Experimental PHP builds

on:
  workflow_dispatch:
    inputs:
      php_minor:
        type: choice
        options: [all, "8.1", "8.2", "8.3", "8.4", "8.5", "8.6"]
        default: all
      target:
        type: choice
        options: [all, ubuntu-22.04, macos-15]
        default: all
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      containers: ${{ steps.matrix.outputs.containers }}
    steps:
      - id: matrix
        env:
          PHP_MINOR: ${{ inputs.php_minor }}
          TARGET: ${{ inputs.target }}
        run: |
          {
            echo "value<<MATRIX_EOF"
            jq -cn --arg php "$PHP_MINOR" --arg target "$TARGET" '{
              include: (
                ["8.1", "8.2", "8.3", "8.4", "8.5", "8.6"] as $minors
                | [{"os": "ubuntu-22.04", "arch": "x86_64"}, {"os": "macos-15", "arch": "arm64"}] as $targets
                | [ $minors[] as $m | $targets[] as $t
                    | select($php == "all" or $php == $m)
                    | select($target == "all" or $target == $t.os)
                    | {php_minor: $m, os: $t.os, arch: $t.arch} ]
              )
            }'
            echo "MATRIX_EOF"
            echo "containers<<CONTAINERS_EOF"
            jq -cn --arg php "$PHP_MINOR" '{
              include: (
                ["8.1", "8.2", "8.3", "8.4", "8.5", "8.6"] as $minors
                | [
                  {"distro": "ubuntu-22.04", "image": "ubuntu:22.04"},
                  {"distro": "ubuntu-24.04", "image": "ubuntu:24.04"},
                  {"distro": "debian-bookworm", "image": "debian:bookworm"},
                  {"distro": "debian-trixie", "image": "debian:trixie"},
                  {"distro": "fedora", "image": "fedora:latest"},
                  {"distro": "centos-stream-9", "image": "quay.io/centos/centos:stream9"},
                  {"distro": "centos-stream-10", "image": "quay.io/centos/centos:stream10"},
                  {"distro": "rocky-8", "image": "rockylinux:8"},
                  {"distro": "rocky-9", "image": "rockylinux:9"},
                  {"distro": "rocky-10", "image": "rockylinux:10"},
                  {"distro": "alma-8", "image": "almalinux:8"},
                  {"distro": "alma-9", "image": "almalinux:9"},
                  {"distro": "alma-10", "image": "almalinux:10"},
                  {"distro": "oracle-8", "image": "oraclelinux:8"},
                  {"distro": "oracle-9", "image": "oraclelinux:9"},
                  {"distro": "oracle-10", "image": "oraclelinux:10"},
                  {"distro": "amazonlinux-2023", "image": "amazonlinux:2023"},
                  {"distro": "arch", "image": "archlinux:base-devel"},
                  {"distro": "alpine", "image": "alpine:latest"}
                ] as $distros
                | [ $minors[] as $m | $distros[] as $d
                    | select($php == "all" or $php == $m)
                    | {php_minor: $m, distro: $d.distro, image: $d.image, arch: "x86_64"} ]
              )
            }'
            echo "CONTAINERS_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: PHP ${{ matrix.php_minor }} / ${{ matrix.os }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential autoconf pkg-config \
              libssl-dev libxml2-dev libcurl4-openssl-dev libsqlite3-dev \
              zlib1g-dev libonig-dev libreadline-dev libzip-dev libbz2-dev \
              libpng-dev libjpeg-dev libwebp-dev libicu-dev
          else
            brew install autoconf pkg-config openssl@3 libxml2 curl \
              sqlite3 zlib oniguruma readline libzip bzip2 libiconv libpng jpeg-turbo \
              webp icu4c
          fi
      - uses: jdx/mr-boxington-action@v1
      - name: Build Rust CLI
        run: mbx build --release --locked
      - name: Build PHP package
        env:
          PHP_MINOR: ${{ matrix.php_minor }}
        run: target/release/php-builds build --minor "$PHP_MINOR" --root "${{ runner.temp }}/php-build"
      - name: Verify relocated package
        env:
          PHP_MINOR: ${{ matrix.php_minor }}
        run: target/release/php-builds verify --package "${{ runner.temp }}/php-build/package" --minor "$PHP_MINOR"
      - name: Upload package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.php_minor }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/php-build/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-php-${{ matrix.php_minor }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/php-build/logs/*
          if-no-files-found: ignore
          retention-days: 14

  build-container:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.containers) }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 120
    defaults:
      run:
        shell: sh
    steps:
      - name: Bootstrap git and curl
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y git curl ca-certificates
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y git
            command -v curl >/dev/null 2>&1 || dnf install -y curl-minimal
          elif command -v microdnf >/dev/null 2>&1; then
            microdnf install -y git
            command -v curl >/dev/null 2>&1 || microdnf install -y curl-minimal
          elif command -v yum >/dev/null 2>&1; then
            yum install -y git
            command -v curl >/dev/null 2>&1 || yum install -y curl-minimal
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache git curl bash
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Syu --noconfirm git curl
          else
            echo "Error: no supported package manager found." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sh ci/install-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust CLI
        run: cargo build --release --locked
      - name: Build PHP package
        env:
          PHP_MINOR: ${{ matrix.php_minor }}
        run: target/release/php-builds build --minor "$PHP_MINOR" --root /tmp/php-build
      - name: Verify relocated package
        env:
          PHP_MINOR: ${{ matrix.php_minor }}
        run: target/release/php-builds verify --package /tmp/php-build/package --minor "$PHP_MINOR"
      - name: Upload package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.php_minor }}-${{ matrix.distro }}-${{ matrix.arch }}
          path: /tmp/php-build/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-php-${{ matrix.php_minor }}-${{ matrix.distro }}-${{ matrix.arch }}
          path: /tmp/php-build/logs/*
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: [plan, build, build-container]
    if: ${{ inputs.release == true && inputs.php_minor != 'all' && needs.build.result == 'success' && needs.build-container.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Assemble release assets
        id: assets
        run: |
          mkdir release-assets
          version=""
          for package in artifacts/php-*; do
            [ -d "$package" ] || continue
            manifest="$package/manifest.json"
            [ -f "$manifest" ] || continue
            package_version="$(jq -er '.source_version' "$manifest")"
            if [ -z "$version" ]; then
              version="$package_version"
            elif [ "$version" != "$package_version" ]; then
              echo "::error::Package manifests report different PHP versions: $version and $package_version"
              exit 1
            fi
            artifact="${package##*/}"
            for asset in "$package"/*; do
              [ -f "$asset" ] || continue
              name="$(basename "$asset")"
              if [ "$name" = manifest.json ] || [ "$name" = SHA256SUMS ]; then
                cp "$asset" "release-assets/${artifact}-${name}"
              else
                cp "$asset" "release-assets/$name"
              fi
            done
          done
          [ -n "$version" ] || { echo "::error::No package manifests found"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="php-${{ steps.assets.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --title "PHP ${{ steps.assets.outputs.version }}" --prerelease
          fi
